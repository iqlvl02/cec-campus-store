<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | CEC Campus Store</title>
    {% load static %}
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .bg-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('{% static "image/background.jpg" %}');
            background-size: cover;
            background-position: center;
            filter: blur(10px) brightness(0.6);
            z-index: 1;
        }

        .success-wrapper {
            position: relative;
            z-index: 10;
            max-width: 500px;
            width: 100%;
        }

        .success-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .success-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .success-container h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .success-message {
            background: #e8f5e9;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        .btn-primary {
            background: #004a99;
            color: white;
        }

        .btn-secondary {
            background: #ffc107;
            color: #333;
        }

        .btn-outline {
            background: #e4e6eb;
            color: #333;
        }
    </style>
</head>
<body>

    <div class="bg-blur"></div>

    <div class="success-wrapper">
        <div class="success-container">
            <div class="success-icon">✅</div>
            <h2>Order Confirmed!</h2>
            <p>Your pre-order has been successfully submitted.</p>
            
            <div class="success-message">
                <p style="margin-bottom: 10px;">Thank you for ordering with CEC Campus Store!</p>
                <p style="font-size: 0.9rem; color: #666;">Please save your Order ID for tracking.</p>
                <p style="font-size: 0.9rem; color: #666;">You will be notified when your order is ready for pickup.</p>
            </div>

            <div class="btn-group">
                <a href="{% url 'store:track_order' %}" class="btn btn-secondary">📦 Track Your Order</a>
                <a href="{% url 'store:order_create' %}" class="btn btn-primary">🛒 Place Another Order</a>
            </div>
        </div>
    </div>

</body>
</html>
